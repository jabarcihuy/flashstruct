<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: komposisi-a.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f7f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1505px">
  <div class="r-header region chrome" data-region="header"><!-- Horizontal white header with thin bottom border --></div>
  <div class="r-brand region text" data-region="brand"><!-- FlashStruct brand wordmark --><p style="font-size:var(--r-brand-font);line-height:1.05;margin:0">brand</p></div>
  <div class="r-navigation region control" data-region="navigation"><!-- Five navigation text links: rebuild the control's chrome from the crop (comp-spec.mjs --crop navigation); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-theme region control" data-region="theme"><!-- Theme control replaces unsupported avatar from generated comp: rebuild the control's chrome from the crop (comp-spec.mjs --crop theme); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-heading region text" data-region="heading"><!-- Lanjutkan belajarmu --><p style="font-size:var(--r-heading-font);font-family:var(--r-heading-family),sans-serif;font-weight:var(--r-heading-weight);line-height:1.05;margin:0">heading</p></div>
  <div class="r-intro region text" data-region="intro"><!-- Short supporting sentence --><p style="font-size:var(--r-intro-font);line-height:1.05;margin:0">intro</p></div>
  <div class="r-recommendation-frame region chrome" data-region="recommendation-frame"><!-- Single thin bordered recommendation container --></div>
  <div class="r-recommendation-label region text" data-region="recommendation-label"><!-- Modul yang disarankan --><p style="font-size:var(--r-recommendation-label-font);line-height:1.05;margin:0">recommendation-label</p></div>
  <div class="r-lesson-title region text" data-region="lesson-title"><!-- Dasar Array & Indeks --><p style="font-size:var(--r-lesson-title-font);line-height:1.05;margin:0">lesson-title</p></div>
  <div class="r-lesson-description region text" data-region="lesson-description"><!-- Lesson description over two lines --><p style="font-size:var(--r-lesson-description-font);line-height:1.05;margin:0">lesson-description</p></div>
  <div class="r-lesson-action region control" data-region="lesson-action"><!-- Baca Modul blue button: rebuild the control's chrome from the crop (comp-spec.mjs --crop lesson-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-lesson-progress region control" data-region="lesson-progress"><!-- Progres modul, Belum dimulai and horizontal progress bar: rebuild the control's chrome from the crop (comp-spec.mjs --crop lesson-progress); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-stage-1 region control" data-region="stage-1"><!-- Pahami stage and availability description: rebuild the control's chrome from the crop (comp-spec.mjs --crop stage-1); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-stage-2 region control" data-region="stage-2"><!-- Hafalkan stage and availability description: rebuild the control's chrome from the crop (comp-spec.mjs --crop stage-2); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-stage-3 region control" data-region="stage-3"><!-- Buktikan stage and availability description: rebuild the control's chrome from the crop (comp-spec.mjs --crop stage-3); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-summary region chrome" data-region="summary"><!-- Three-column bordered summary strip --></div>
  <div class="r-summary-total region text" data-region="summary-total"><!-- Total modul with number and context --><p style="font-size:var(--r-summary-total-font);line-height:1.05;margin:0">summary-total</p></div>
  <div class="r-summary-completed region text" data-region="summary-completed"><!-- Modul selesai with number and context --><p style="font-size:var(--r-summary-completed-font);line-height:1.05;margin:0">summary-completed</p></div>
  <div class="r-summary-progress region text" data-region="summary-progress"><!-- Progres belajar with number and context --><p style="line-height:1.05;margin:0">summary-progress</p></div>
  <div class="r-list-title region text" data-region="list-title"><!-- Daftar Modul --><p style="font-size:var(--r-list-title-font);line-height:1.05;margin:0">list-title</p></div>
  <div class="r-filters region control" data-region="filters"><!-- Semua Array Struct Pointer filters: rebuild the control's chrome from the crop (comp-spec.mjs --crop filters); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-module-1 region control" data-region="module-1"><!-- Module row with title, topic, description, progress, three stage icons and arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop module-1); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-module-2 region control" data-region="module-2"><!-- Module row with title, topic, description, progress, three stage icons and arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop module-2); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-module-3 region control" data-region="module-3"><!-- Module row with title, topic, description, progress, three stage icons and arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop module-3); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-module-4 region control" data-region="module-4"><!-- Module row with title, topic, description, progress, three stage icons and arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop module-4); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-footer region text" data-region="footer"><!-- Local progress notice and brand line --><p style="font-size:var(--r-footer-font);line-height:1.05;margin:0">footer</p></div>
</main>
</body>
</html>
