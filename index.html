<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover wajib agar env(safe-area-inset-*) berfungsi.
      JANGAN tambahkan maximum-scale atau user-scalable=no —
      itu melanggar WCAG 1.4.4 dan menghalangi pengguna memperbesar teks.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="theme-color" content="#FDF4D2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#322121" media="(prefers-color-scheme: dark)" />

    <meta
      name="description"
      content="FlashStruct — belajar Struktur Data (array, struct, pointer) dengan flashcard. Pahami, hafalkan, buktikan."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Font: preconnect agar lebih cepat, display=swap agar teks langsung terbaca -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>FlashStruct — Belajar Struktur Data dengan Flashcard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
