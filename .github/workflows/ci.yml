name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Batalkan run lama bila ada push baru ke branch yang sama —
# menghemat menit CI tanpa kehilangan umpan balik.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # Gerbang 1: cepat (< 1 menit). Ini yang memblokir.
  # Typecheck, lint, dan unit test — semua yang tidak butuh browser.
  # =========================================================
  kualitas:
    name: Typecheck, Lint, Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Cek format
        run: npm run format:check

      - name: Unit test
        run: npm run test

  # =========================================================
  # Gerbang 2: E2E + aksesibilitas. Lebih lambat (~10 menit).
  # Dijalankan setelah gerbang 1 lulus — tidak ada gunanya menguji
  # browser bila kode saja tidak lolos typecheck.
  #
  # PENTING: job ini LEWAT (bukan gagal) bila secrets Supabase belum
  # diset. Alasannya: tanpa kredensial, aplikasi gagal start dan SEMUA
  # test E2E gagal sekaligus — kegagalan yang tidak informatif dan
  # membuat orang mengabaikan status CI.
  #
  # Cara mengaktifkan (sekali saja):
  #   Settings > Secrets and variables > Actions > New repository secret
  #     VITE_SUPABASE_URL               = https://<project-ref>.supabase.co
  #     VITE_SUPABASE_PUBLISHABLE_KEY   = sb_publishable_...
  #
  # Catatan: repo ini PUBLIK. Publishable key memang dirancang untuk
  # browser dan dilindungi RLS, tetapi tetap diperlakukan sebagai
  # kredensial: disimpan sebagai secret, bukan di dalam repo.
  # =========================================================
  e2e:
    name: E2E & Aksesibilitas
    runs-on: ubuntu-latest
    needs: kualitas
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Cek ketersediaan secrets
        id: cek-secrets
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" ]; then
            echo "tersedia=false" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E DILEWATI — secrets Supabase belum diset."
            echo "::warning::Tambahkan VITE_SUPABASE_URL dan VITE_SUPABASE_PUBLISHABLE_KEY di Settings > Secrets and variables > Actions."
            echo "::warning::Sampai itu dilakukan, jalur kritis TIDAK terverifikasi di CI."
          else
            echo "tersedia=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pasang browser Playwright
        if: steps.cek-secrets.outputs.tersedia == 'true'
        run: npx playwright install --with-deps chromium firefox

      - name: Jalankan E2E
        if: steps.cek-secrets.outputs.tersedia == 'true'
        run: npx playwright test --project=chromium --project=firefox
        env:
          # Nama variabel HARUS cocok dengan yang dibaca `src/lib/supabase.ts`.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          CI: true

      - name: Simpan laporan bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
